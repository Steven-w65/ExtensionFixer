name: Build SuffixFixer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build SuffixFixer
        run: |
          pyinstaller --onefile --windowed --name SuffixFixer --icon=app.ico --add-data "app.ico;." main.py

      - name: Copy configuration
        run: |
          copy custom_magic_formats.json dist\custom_magic_formats.json

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SuffixFixer-Windows
          path: dist\
